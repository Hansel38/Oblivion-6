name: C++ build

on:
  push:
    branches:
      - main
      - hardening/anti-cheat-bugfixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-server:
    name: Linux server (GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
      - name: Test heartbeat protocol helpers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/heartbeat_protocol_test.cpp -o /tmp/heartbeat_protocol_test
          /tmp/heartbeat_protocol_test
      - name: Build Linux server
        run: |
          make -C server clean
          make -C server

  windows-solution:
    name: Windows solution (${{ matrix.configuration }} | ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build ${{ matrix.configuration }} configuration
        shell: pwsh
        run: |
          msbuild Oblivion.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /verbosity:minimal
