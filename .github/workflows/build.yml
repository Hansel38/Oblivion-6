name: C++ build

on:
  push:
    branches:
      - main
      - hardening/anti-cheat-bugfixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-server:
    name: Linux server (GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
      - name: Test heartbeat protocol helpers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/heartbeat_protocol_test.cpp -o /tmp/heartbeat_protocol_test
          /tmp/heartbeat_protocol_test
      - name: Test TCP socket framing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I server/include tests/socket_framing_test.cpp -lcrypto -o /tmp/socket_framing_test
          /tmp/socket_framing_test
      - name: Test challenge nonce validation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I server/include tests/protocol_validation_test.cpp -o /tmp/protocol_validation_test
          /tmp/protocol_validation_test
      - name: Test network configuration validation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/network_configuration_test.cpp -o /tmp/network_configuration_test
          /tmp/network_configuration_test
      - name: Test server runtime configuration
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/server_runtime_config_test.cpp -o /tmp/server_runtime_config_test
          /tmp/server_runtime_config_test
      - name: Test ban-list file availability
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/ban_list_file_test.cpp -o /tmp/ban_list_file_test
          /tmp/ban_list_file_test
      - name: Test listener address fallback
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/listener_socket_test.cpp -o /tmp/listener_socket_test
          /tmp/listener_socket_test
      - name: Test explicit server secret provisioning
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I server/include tests/server_secret_config_test.cpp server/src/server_secret.cpp -o /tmp/server_secret_config_test
          /tmp/server_secret_config_test
      - name: Test client secret source selection
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/client_secret_source_policy_test.cpp -o /tmp/client_secret_source_policy_test
          /tmp/client_secret_source_policy_test
      - name: Test shared secret validation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/secret_validation_test.cpp -o /tmp/secret_validation_test
          /tmp/secret_validation_test
      - name: Validate Linux management scripts
        run: |
          bash -n server/oblivion-start
          bash -n server/oblivion-server-start
      - name: Test HWID WMI source validation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/hwid_source_validation_test.cpp -o /tmp/hwid_source_validation_test
          /tmp/hwid_source_validation_test
      - name: Build Linux server
        run: |
          make -C server clean
          make -C server

  windows-solution:
    name: Windows solution (${{ matrix.configuration }} | ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build ${{ matrix.configuration }} configuration
        shell: pwsh
        run: |
          msbuild Oblivion.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /verbosity:minimal
